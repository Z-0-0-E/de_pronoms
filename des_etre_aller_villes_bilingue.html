<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Dés : pronoms + être/aller + villes</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --size: 190px; }

    * { box-sizing: border-box; }

    body {
      font-family: "Noto Sans SC", sans-serif;
    }

    .label, button, .correct-sentence, .correction-detail, footer, .speak-button,
    .face, .coin-face {
      font-family: "Barlow Condensed", "Noto Sans SC", sans-serif;
      font-weight: 200;
    }

    .label {
      transform: translateY(-12px);
      margin-bottom: -12px;
    }

    .label .zh,
    .ui-zh,
    .sentence-translation {
      font-family: "Noto Sans SC", sans-serif;
      font-size: 14px;
      line-height: 1.45;
      font-weight: 500;
      color: #555566;
    }

    .ui-zh {
      margin-top: 2px;
    }

    .sentence-translation {
      margin: 1px 0 7px;
      font-size: 17px;
      color: #555566;
    }

    .correction-detail .zh {
      display: inline;
      font-family: "Noto Sans SC", sans-serif;
      font-size: 14px;
      font-weight: 500;
    }

    footer {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 300;
    }

    .speak-button .fr {
      font-family: "Barlow Condensed", sans-serif;
    }

    body {
      font-family: Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: linear-gradient(180deg, #eef2ff, #ffffff);
      color: #00002E;
      user-select: none;
    }

    .game {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 70px;
      width: 100%;
    }

    .item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .label {
      font-size: 17px;
      font-weight: 700;
      color: #555566;
    }

    .scene {
      width: var(--size);
      height: var(--size);
      perspective: 900px;
    }

    .cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1s cubic-bezier(.2, .8, .2, 1);
    }

    .face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 32px;
      font-weight: 700;
      color: #F1F1F9;
      border-radius: 18px;
      box-shadow: 0 6px 18px rgba(0, 0, 46, .16);
      backface-visibility: hidden;
      text-align: center;
    }

    .face .icon {
      font-size: 56px;
      line-height: 1;
    }

    .face span:last-child {
      padding: 7px 12px;
      border-radius: 10px;
      background: rgba(0, 0, 46, 0.22);
    }

    /* Dé des pronoms */
    .pronoun .f1 { transform: translateZ(calc(var(--size)/2)); background: #2D4DF2; }
    .pronoun .f2 { transform: rotateY(90deg) translateZ(calc(var(--size)/2)); background: #FF9F43; }
    .pronoun .f3 { transform: rotateY(180deg) translateZ(calc(var(--size)/2)); background: #00D2D3; }
    .pronoun .f4 { transform: rotateY(-90deg) translateZ(calc(var(--size)/2)); background: #5F27CD; }
    .pronoun .f5 { transform: rotateX(90deg) translateZ(calc(var(--size)/2)); background: #10AC84; }
    .pronoun .f6 { transform: rotateX(-90deg) translateZ(calc(var(--size)/2)); background: #DA33BF; }

    /* Jeton être / aller */
    .coin-scene {
      width: var(--size);
      height: var(--size);
      perspective: 900px;
    }

    .coin {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1.1s cubic-bezier(.2, .8, .2, 1);
    }

    .coin-face {
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
      font-weight: 800;
      color: #F1F1F9;
      backface-visibility: hidden;
      border: 8px solid rgba(255,255,255,.72);
      box-shadow:
        0 7px 18px rgba(0, 0, 46, .20),
        inset 0 0 0 4px rgba(0,0,46,.10);
    }

    .coin-front {
      background: #018CE1;
      transform: translateZ(10px);
    }

    .coin-back {
      background: #FF9F43;
      transform: rotateY(180deg) translateZ(10px);
    }

    /* Dé des villes */
    .city .f1 { transform: translateZ(calc(var(--size)/2)); background: #018CE1; }
    .city .f2 { transform: rotateY(90deg) translateZ(calc(var(--size)/2)); background: #5F27CD; }
    .city .f3 { transform: rotateY(180deg) translateZ(calc(var(--size)/2)); background: #10AC84; }
    .city .f4 { transform: rotateY(-90deg) translateZ(calc(var(--size)/2)); background: #2D4DF2; }
    .city .f5 { transform: rotateX(90deg) translateZ(calc(var(--size)/2)); background: #FF9F43; }
    .city .f6 { transform: rotateX(-90deg) translateZ(calc(var(--size)/2)); background: #00D2D3; }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      min-height: 105px;
    }

    #rollButton, #answerButton {
      border: none;
      border-radius: 12px;
      padding: 8px 20px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 0, 46, .16);
    }

    #rollButton {
      background: #00002E;
      color: white;
    }

    #rollButton:hover { background: #10104A; }

    #answerButton {
      background: #F1F1F9;
      color: #00002E;
      border: 1px solid #E9E9F8;
      display: none;
    }

    #answerButton:hover { background: #E9E9F8; }

    #answer {
      min-height: 150px;
      padding: 8px 18px;
      text-align: center;
      color: #00002E;
    }

    .correct-sentence {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.3;
    }

    .correct-sentence::first-letter {
      text-transform: uppercase;
    }

    .correction-detail {
      margin-top: 5px;
      font-size: 16px;
      font-weight: 500;
      color: #555566;
    }

    .speak-button {
      margin-top: 10px;
      border: 1px solid #E9E9F8;
      border-radius: 12px;
      padding: 6px 16px;
      font-size: 17px;
      font-weight: 700;
      background: #F1F1F9;
      color: #00002E;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 0, 46, .16);
    }

    .speak-button:hover { background: #E9E9F8; }

    footer {
      position: fixed;
      left: 12px;
      bottom: 20px;
      color: #555566;
      font-size: 15px;
      pointer-events: none;
    }

    @media (max-width: 850px) {
      :root { --size: 145px; }

      .game {
        gap: 20px;
      }

      .face { font-size: 24px; }
      .face .icon { font-size: 42px; }
      .coin-face { font-size: 26px; }
    }

    @media (max-width: 640px) {
      :root { --size: 150px; }

      body {
        justify-content: flex-start;
        padding: 24px 12px 55px;
        overflow-y: auto;
      }

      .game {
        flex-direction: column;
        gap: 22px;
      }

      .item { gap: 6px; }

      .label { font-size: 16px; }

      footer {
        left: 0;
        right: 0;
        text-align: center;
      }
    }
  </style>
</head>

<body>
  <div class="game">

    <!-- Dé des pronoms -->
    <div class="item">
      <div class="label">Pronom<span class="zh"> · 人称代词</span><br><br></div>
      <div class="scene pronoun">
        <div id="cubePronoun" class="cube">
          <div class="face f1"><span>je</span></div>
          <div class="face f2"><span>tu</span></div>
          <div class="face f3"><span>il/elle</span></div>
          <div class="face f4"><span>nous</span></div>
          <div class="face f5"><span>vous</span></div>
          <div class="face f6"><span>ils/elles</span></div>
        </div>
      </div>
    </div>

    <!-- Jeton être / aller -->
    <div class="item">
      <div class="label">Verbe<span class="zh"> · 动词</span><br><br></div>
      <div class="coin-scene">
        <div id="coin" class="coin">
          <div class="coin-face coin-front">être</div>
          <div class="coin-face coin-back">aller</div>
        </div>
      </div>
    </div>

    <!-- Dé des villes -->
    <div class="item">
      <div class="label">Ville<span class="zh"> · 城市<br><br></span></div>
      <div class="scene city">
        <div id="cubeCity" class="cube">
          <div class="face f1"><div class="icon">🗼</div><span>Paris</span></div>
          <div class="face f2"><div class="icon">🏛️</div><span>Pékin</span></div>
          <div class="face f3"><div class="icon">🦁</div><span>Lyon</span></div>
          <div class="face f4"><div class="icon">🏙️</div><span>Shanghai</span></div>
          <div class="face f5"><div class="icon">⚓</div><span>Marseille</span></div>
          <div class="face f6"><div class="icon">🌆</div><span>Hongkong</span></div>
        </div>
      </div>
    </div>

  </div>

  <div class="controls">
    <button id="rollButton">Lancer<span class="ui-zh" style="color: #E9E9F8;"> · 掷骰子</span></button>
    <button id="answerButton">Afficher le corrigé<span class="ui-zh"> · 显示答案</span></button>
    <div id="answer"></div>
  </div>

  <footer>Appuie sur « Lancer » ou sur la barre d'espace. <span class="ui-zh">点击“掷骰子”或按空格键开始。</span></footer>

  <script>
    const cubePronoun = document.getElementById('cubePronoun');
    const cubeCity = document.getElementById('cubeCity');
    const coin = document.getElementById('coin');
    const rollButton = document.getElementById('rollButton');
    const answerButton = document.getElementById('answerButton');
    const answer = document.getElementById('answer');

    // Rotation du cube à appliquer pour amener chaque face (f1 à f6) devant.
    // Corrigé : f5 (dessus, rotateX(90deg)) demande rotateX(-90deg),
    // et f6 (dessous, rotateX(-90deg)) demande rotateX(90deg).
    const faceRotations = [
      { x: 0, y: 0 },
      { x: 0, y: -90 },
      { x: 0, y: 180 },
      { x: 0, y: 90 },
      { x: -90, y: 0 },
      { x: 90, y: 0 }
    ];

    const pronouns = ['je', 'tu', 'il/elle', 'nous', 'vous', 'ils/elles'];
    const cities = ['Paris', 'Pékin', 'Lyon', 'Shanghai', 'Marseille', 'Hongkong'];

    let lastPronounIndices = [];
    let lastCityIndices = [];
    let lastVerb = null;
    let currentSentences = [];

    const speechOK = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;

    function pickFrenchVoice() {
      const voices = window.speechSynthesis.getVoices();
      return voices.find(v => v.lang === 'fr-FR') ||
             voices.find(v => v.lang && v.lang.toLowerCase().startsWith('fr')) ||
             null;
    }

    // Orthographe « phonétique » utilisée uniquement pour l'audio
    // (l'affichage garde l'écriture normale).
    const spokenForms = {
      'Hongkong': 'Ongue-Kongue'
    };

    function toSpoken(text) {
      const t = Object.entries(spokenForms).reduce(
        (acc, [written, spoken]) => acc.split(written).join(spoken),
        text
      );
      // Pas de liaison facultative (verbe + « à ») : une virgule crée
      // une micro-pause qui bloque la liaison. Les liaisons obligatoires
      // (nous_allons, vous_allez, vous_êtes) ne sont pas touchées.
      return t.split(' à ').join(', à ');
    }

    function speak(sentences) {
      if (!speechOK || !sentences.length) return;
      window.speechSynthesis.cancel();
      const voice = pickFrenchVoice();
      sentences.forEach(text => {
        const u = new SpeechSynthesisUtterance(toSpoken(text));
        u.lang = 'fr-FR';
        u.rate = 0.9;
        if (voice) u.voice = voice;
        window.speechSynthesis.speak(u);
      });
    }

    // Certains navigateurs chargent la liste des voix en différé.
    if (speechOK) window.speechSynthesis.getVoices();

    function rollCube(cube, lastIndices) {
      let idx;
      do {
        idx = Math.floor(Math.random() * 6);
      } while (lastIndices.includes(idx));

      const rot = faceRotations[idx];
      const spinsX = (Math.floor(Math.random() * 4) + 1) * 360;
      const spinsY = (Math.floor(Math.random() * 4) + 1) * 360;

      cube.style.transform =
        `rotateX(${rot.x + spinsX}deg) rotateY(${rot.y + spinsY}deg)`;

      lastIndices.push(idx);
      if (lastIndices.length > 2) lastIndices.shift();

      return idx;
    }

    function rollCoin() {
      // 0 = être, 1 = aller
      const idx = Math.random() < 0.5 ? 0 : 1;
      const spins = (Math.floor(Math.random() * 4) + 2) * 360;
      const y = idx === 0 ? 0 : 180;
      coin.style.transform = `rotateY(${y + spins}deg)`;
      lastVerb = idx === 0 ? 'être' : 'aller';
      return idx;
    }

    function getAnswer(pronoun, verb, city) {
      const etre = {
        'je': 'suis',
        'tu': 'es',
        'il/elle': 'est',
        'nous': 'sommes',
        'vous': 'êtes',
        'ils/elles': 'sont'
      };

      const aller = {
        'je': 'vais',
        'tu': 'vas',
        'il/elle': 'va',
        'nous': 'allons',
        'vous': 'allez',
        'ils/elles': 'vont'
      };

      // Pour il/elle et ils/elles, on affiche deux phrases.
      const displayForms = {
        'il/elle': ['il', 'elle'],
        'ils/elles': ['ils', 'elles']
      };

      const conjugation = verb === 'être' ? etre : aller;
      const forms = displayForms[pronoun] || [pronoun];
      return {
        sentences: forms.map(f => `${f} ${conjugation[pronoun]} à ${city}`),
        infinitive: verb,
        conjugated: conjugation[pronoun]
      };
    }

    function rollAll() {
      const p = rollCube(cubePronoun, lastPronounIndices);
      const c = rollCube(cubeCity, lastCityIndices);
      rollCoin();

      // Store the current result for the correction button.
      window.currentPronoun = pronouns[p];
      window.currentCity = cities[c];

      if (speechOK) window.speechSynthesis.cancel();
      currentSentences = [];
      answer.textContent = '';
      answerButton.style.display = 'inline-block';
    }

    rollButton.addEventListener('click', rollAll);

    answerButton.addEventListener('click', (event) => {
      event.stopPropagation();
      if (!window.currentPronoun || !window.currentCity || !lastVerb) return;

      const result = getAnswer(
        window.currentPronoun,
        lastVerb,
        window.currentCity
      );

      currentSentences = result.sentences.map(t => `${t}.`);

      const subjectTranslations = {
        'je': '我', 'tu': '你', 'il': '他', 'elle': '她',
        'nous': '我们', 'vous': '你们 / 您', 'ils': '他们', 'elles': '她们'
      };
      const cityTranslations = {
        'Paris': '巴黎', 'Pékin': '北京', 'Lyon': '里昂',
        'Shanghai': '上海', 'Marseille': '马赛', 'Hongkong': '香港'
      };
      const chineseSentences = result.sentences.map(t => {
        const match = t.match(/^(je|tu|il|elle|nous|vous|ils|elles)\s+\S+\s+à\s+(.+)$/);
        if (!match) return '';
        const subject = subjectTranslations[match[1]] || '';
        const city = cityTranslations[match[2]] || match[2];
        const isAller = result.infinitive === 'aller';
        return isAller
          ? `${subject}${match[1] === 'je' ? '去' : '去'}${city}`
          : `${subject}在${city}`;
      });

      answer.innerHTML =
        currentSentences
          .map((t, i) => `<div class="correct-sentence">${t}<span class="sentence-translation">&ensp;${chineseSentences[i]}。</span></div>`)
          .join('') +
        `` +
        (speechOK
          ? `<button id="speakButton" class="speak-button" type="button"><span class="fr">🔉 Écouter</span><span class="ui-zh"> · 听发音</span></button>`
          : '');
    });

    // Lecture audio (synthèse vocale du navigateur)
    answer.addEventListener('click', (event) => {
      if (event.target.closest('#speakButton')) {
        event.stopPropagation();
        speak(currentSentences);
      }
    });

    window.addEventListener('keydown', e => {
      if (e.code === 'Space') {
        e.preventDefault();
        rollAll();
      }
    });
  </script>
</body>
</html>
